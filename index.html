<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivasi Aplikasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        /* Menghilangkan efek bayangan/highlight biru saat tombol/input disentuh di HP */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        input:focus, button:focus {
            outline: none;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold tracking-tight mb-1">Aktivasi Aplikasi</h2>
            <p class="text-slate-400 text-sm">Masukkan 16 digit kode unik dari aplikasi Anda.</p>
        </div>

        <!-- Form Input -->
        <div id="form-section">
            <div class="mb-5">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Kode Aktivasi (16 Digit)</label>
                <input type="text" id="activationCode" maxlength="16" placeholder="contoh: ab12cd34ef56gh78" 
                    class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-xl focus:border-indigo-500 lowercase text-center tracking-widest text-lg transition-colors placeholder:text-slate-700 placeholder:normal-case placeholder:tracking-normal">
            </div>
            <button onclick="startActivation()" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold py-3.5 rounded-xl transition duration-150 shadow-lg shadow-indigo-600/20">
                Aktivasi Sekarang
            </button>
        </div>

        <!-- Loading Section -->
        <div id="loading-section" class="hidden text-center py-6">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-t-2 border-indigo-500 border-solid mb-4"></div>
            <p class="text-slate-200 font-medium">Memproses Aktivasi...</p>
            <p class="text-xs text-slate-500 mt-2">Mohon tunggu sebentar, sistem sedang memverifikasi perangkat.</p>
        </div>

        <!-- Success Section -->
        <div id="success-section" class="hidden text-center py-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 text-2xl mb-3">✓</div>
            <h3 class="text-lg font-bold text-emerald-400 mb-1">Aktivasi Berhasil!</h3>
            <p class="text-xs text-slate-400 leading-relaxed">Silakan kembali ke aplikasi Anda. Aplikasi akan otomatis terbuka ke menu utama.</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCp7IdKTm6_Bt3k861gfHVY_vQwKRDgYl0",
            authDomain: "activation-code-1c10c.firebaseapp.com",
            databaseURL: "https://activation-code-1c10c-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "activation-code-1c10c",
            storageBucket: "activation-code-1c10c.firebasestorage.app",
            messagingSenderId: "623489617991",
            appId: "1:623489617991:web:4bd9aacb7a42dcc674e162",
            measurementId: "G-44GRRXW5WF"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function startActivation() {
            const codeInput = document.getElementById('activationCode').value.trim().toLowerCase();
            
            if (codeInput.length !== 16) {
                alert("Kode aktivasi harus tepat 16 karakter!");
                return;
            }

            db.ref('activations/' + codeInput).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    document.getElementById('form-section').classList.add('hidden');
                    document.getElementById('loading-section').classList.remove('hidden');

                    // Waktu verifikasi pas 3 detik (3000 ms)
                    setTimeout(() => {
                        db.ref('activations/' + codeInput).update({
                            status: "success"
                        }, (error) => {
                            if (!error) {
                                document.getElementById('loading-section').classList.add('hidden');
                                document.getElementById('success-section').classList.remove('hidden');
                            } else {
                                alert("Terjadi kesalahan jaringan. Silakan coba lagi.");
                                location.reload();
                            }
                        });
                    }, 3000);

                } else {
                    alert("Kode aktivasi tidak valid! Pastikan Anda membuka aplikasi dan menyalin kode terbaru.");
                }
            });
        }
    </script>
</body>
</html>
